version: '3.8'

services:
  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: rainrag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI backend
  api:
    image: rainrag:latest
    container_name: rainrag-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - RAINRAG_CONFIG=/app/config.yaml
      - RAINRAG_AUTH_TOKEN=${RAINRAG_AUTH_TOKEN:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/data/rainrag
      - ./embeddings:/data/embeddings
    command: >
      python -m uvicorn rainrag.api:app
      --host 0.0.0.0
      --port 8001
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Streamlit frontend
  streamlit:
    image: rainrag:latest
    container_name: rainrag-streamlit
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - RAINRAG_API_URL=http://api:8001
      - STREAMLIT_AUTH_TOKEN=${STREAMLIT_AUTH_TOKEN:-}
    volumes:
      - ./app.py:/app/app.py:ro
    command: >
      streamlit run /app/app.py
      --server.address 0.0.0.0
      --server.port 7860
      --server.headless true
    depends_on:
      api:
        condition: service_healthy

volumes:
  qdrant_storage:
