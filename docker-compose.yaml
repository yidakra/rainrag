
services:
  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:v1.16.3
    container_name: rainrag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for session storage
  redis:
    image: redis:7-alpine
    container_name: rainrag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI backend
  api:
    image: rainrag:latest
    container_name: rainrag-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - RAINRAG_CONFIG=/app/config.yaml
      - RAINRAG_AUTH_TOKEN=${RAINRAG_AUTH_TOKEN:-}
      - MISTRAL_API_KEY_FILE=/run/secrets/mistral_api_key
      - COHERE_API_KEY_FILE=/run/secrets/cohere_api_key
      # Optional providers (uncomment + create secret file if using):
      # - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      # - ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key
      # - GOOGLE_API_KEY_FILE=/run/secrets/google_api_key
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./embeddings:/app/embeddings
    # Default providers: Mistral (LLM) and Cohere (reranking). If you use other
    # providers (OpenAI, Anthropic, Google Gemini), uncomment the matching secret(s).
    secrets:
      - mistral_api_key
      - cohere_api_key
      # - openai_api_key
      # - anthropic_api_key
      # - google_api_key
    entrypoint: ["python", "-m", "uvicorn", "rainrag.api:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Streamlit frontend
  streamlit:
    image: rainrag:latest
    container_name: rainrag-streamlit
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - RAINRAG_API_URL=http://api:8001
      - STREAMLIT_AUTH_TOKEN=${STREAMLIT_AUTH_TOKEN:-}
    volumes:
      - ./app.py:/app/app.py:ro
    entrypoint: ["streamlit", "run", "/app/app.py", "--server.address", "0.0.0.0", "--server.port", "7860", "--server.headless", "true"]
    depends_on:
      api:
        condition: service_healthy

  # MCP Server (for Claude Desktop, ChatGPT, Cursor integration)
  mcp:
    image: rainrag:latest
    container_name: rainrag-mcp
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MISTRAL_API_KEY_FILE=/run/secrets/mistral_api_key
      - COHERE_API_KEY_FILE=/run/secrets/cohere_api_key
      # Optional providers (uncomment + create secret file if using):
      # - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      # - ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key
      # - GOOGLE_API_KEY_FILE=/run/secrets/google_api_key
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/data/rainrag
      - ./embeddings:/data/embeddings
      - ./logs:/app/logs
    # Default providers: Mistral (LLM) and Cohere (reranking). If you use other
    # providers (OpenAI, Anthropic, Google Gemini), uncomment the matching secret(s).
    secrets:
      - mistral_api_key
      - cohere_api_key
      # - openai_api_key
      # - anthropic_api_key
      # - google_api_key
    command: rainrag mcp --transport streamable-http --host 0.0.0.0 --port 8000
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/mcp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_storage:
  redis_data:

# API provider secrets (optional; only required for the providers you plan
# to use). Docker Compose will error if a defined secret file does not exist.
#
# Create the secrets directory + files before running `docker-compose up`:
#
#   mkdir -p ./secrets
#   # Either create your own key files, or use the helper:
#   make secrets
#   # Then edit the files with your real keys (do NOT commit them)
#   # e.g. edit ./secrets/mistral_api_key.txt, ./secrets/openai_api_key.txt, etc.
#
# Recommended permissions for production:
#   chmod 600 ./secrets/*.txt
#
# Provider  (config key)   Secret file (mounted as /run/secrets/<name>)
# - mistral  (llm.provider="mistral")   -> ./secrets/mistral_api_key.txt
# - openai   (llm.provider="openai")    -> ./secrets/openai_api_key.txt
# - claude   (llm.provider="claude")    -> ./secrets/anthropic_api_key.txt
# - gemini   (llm.provider="gemini")    -> ./secrets/google_api_key.txt
# - cohere   (reranker.provider="cohere")-> ./secrets/cohere_api_key.txt
#
# If you want to override the secret file path, you can set the corresponding
# *_API_KEY_FILE env var in an env file or via docker-compose override.
secrets:
  # Optional secrets: enable the ones you need for configured providers.
  # If you don't want to use Mistral or Cohere, comment out the corresponding
  # entries (or create placeholder files with `make secrets` / `./create-secrets.sh`).
  #
  # NOTE: also remove or comment out service-level `secrets:` entries in every
  # service that doesn't use these providers (e.g., `api` service has `secrets:`
  # somewhere under its definition). Keep the top-level names `mistral_api_key`
  # and `cohere_api_key` in sync, or switch to an optional pattern like:
  #   - external: true
  # for optional secrets, or use YAML anchors/aliases to deduplicate across
  # multiple services.
  mistral_api_key:
    file: ./secrets/mistral_api_key.txt
  # openai_api_key:
  #   file: ./secrets/openai_api_key.txt
  # anthropic_api_key:
  #   file: ./secrets/anthropic_api_key.txt
  # google_api_key:
  #   file: ./secrets/google_api_key.txt
  cohere_api_key:
    file: ./secrets/cohere_api_key.txt
