[tool.poetry]
name = "rainrag"
version = "0.1.0"
description = "Local-first RAG pipeline for VTT subtitle processing"
authors = ["RainRAG Team"]
readme = "README.md"
packages = [{include = "rainrag", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
torch = "^2.1.0"
transformers = "^4.35.0"
sentence-transformers = "^2.2.2"
qdrant-client = "^1.7.0"
pydantic = "^2.5.0"
loguru = "^0.7.2"
tqdm = "^4.66.0"
typer = {extras = ["all"], version = "^0.12.0"}
pyyaml = "^6.0.1"
numpy = "^1.24.0"
requests = "^2.32.4"
# Web frontend dependencies
streamlit = "^1.31.0"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
httpx = "^0.26.0"
# Optional: vLLM for query functionality (install separately: pip install vllm)
# Note: vLLM requires Python <3.14
vllm = {version = "^0.11.0", optional = true, python = ">=3.10,<3.14"}

[tool.poetry.extras]
query = ["vllm"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
black = "^23.11.0"
ruff = "^0.1.6"
mypy = "^1.7.0"
types-pyyaml = "^6.0.12"

[tool.poetry.scripts]
rainrag = "rainrag.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
