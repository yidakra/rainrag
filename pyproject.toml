[project]
name = "rainrag"
version = "0.1.0"
description = "Local-first RAG pipeline for VTT subtitle processing"
authors = [{name = "RainRAG Team"}]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.1.0,<3.0.0",
    "transformers>=4.35.0,<5.0.0",
    "sentence-transformers>=2.2.2,<3.0.0",
    "qdrant-client>=1.12.0,<2.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "loguru>=0.7.2,<1.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "typer>=0.16.0,<1.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "numpy>=1.26.4,<3.0.0", # relaxed to permit NumPy 2.x after compatibility verification
    # Mistral API client
    "mistralai>=1.0.0,<2.0.0",
    # Web frontend dependencies
    # >=1.40 for st.segmented_control, used by the search-mode selector.
    "streamlit>=1.40.0,<2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.31.1,<1.0.0",
    "prometheus-client>=0.21.1,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "openai>=2.8.1,<3.0.0",
    "anthropic>=0.39.0,<1.0.0",
    "google-genai>=1.73.1,<2.0.0",
    "cohere>=5.20.0,<6.0.0",
    # MCP server
    "mcp[cli]>=1.22.0,<2.0.0",
    # BM25 for hybrid search
    "rank-bm25>=0.2.2,<1.0.0",
    # Security - password hashing
    "argon2-cffi>=23.1.0,<24.0.0",
    # Redis for server-side session storage
    "redis>=5.0.0,<6.0.0",
    # MTProto client for Telegram video downloads (see scripts/telegram_login.py)
    "telethon>=1.44.0,<2.0.0",
    # Video download from URLs (Telegram, YouTube, etc.)
    "yt-dlp>=2026.1.0",
]

[project.optional-dependencies]
eval = [
    "mlflow>=2.14,<3.0.0",
    "ragas>=0.1.0,<0.2.0",
    "rouge-score>=0.1.2,<0.2.0",
    "pandas>=2.0,<3.0.0",
    "datasets>=2.14,<3.0.0",
    "codecarbon>=2.3,<3.0.0",
    "matplotlib>=3.7,<4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "black>=23.11.0,<24.0.0",
    "ruff>=0.5.3,<1.0.0",
    "mypy>=1.7.0,<2.0.0",
    "types-pyyaml>=6.0.12,<7.0.0",
    "pre-commit>=4.4.0,<5.0.0",
    "bandit>=1.9.1,<2.0.0",
]

[project.scripts]
rainrag = "rainrag.cli:app"
rainrag-eval = "rainrag_eval.run_eval:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rainrag", "src/rainrag_eval"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

# Enable specific rule sets
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
]

# Ignore specific rules
lint.ignore = [
    "E402",   # Module level import not at top of file (common in tests)
    "E501",   # Line too long (handled by formatter)
    "PTH123", # open() should be replaced by Path.open() (not always better)
    "PTH103", # os.makedirs() should be replaced by Path.mkdir()
    "SIM117", # Nested with statements (more readable in tests)
    "B017",   # pytest.raises(Exception) is fine for testing
    "B904",   # Exception chaining not always necessary
]

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
    ".ruff_cache",
]

# Allow autofix for all enabled rules
lint.fixable = ["ALL"]
lint.unfixable = []

# Configure isort
lint.isort.known-first-party = ["rainrag", "rainrag_eval"]
lint.isort.force-single-line = false
lint.isort.lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_eval_metrics.py" = ["I001"]
"tests/unit/test_review_eval_set.py" = ["I001"]
"tests/unit/test_run_eval_two_stage.py" = ["I001"]
"tests/unit/test_two_stage_sweep.py" = ["I001"]

# Format configuration
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = false
show_error_codes = true
pretty = true
color_output = true

# Allow untyped calls for libraries without stubs
disallow_untyped_calls = false

# Incremental improvement - start lenient, tighten over time
no_implicit_optional = true

# Exclude test files
exclude = [
    "tests/",
    "build/",
    "dist/",
]

# Per-module options for third-party libraries
[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas",
    "pandas.*",
    "datasets",
    "datasets.*",
    "ragas",
    "ragas.*",
    "rouge_score",
    "rouge_score.*",
    "codecarbon",
    "codecarbon.*",
    "mlflow",
    "mlflow.*",
    "matplotlib",
    "matplotlib.*",
    "rank_bm25",
    "rank_bm25.*",
    "rich",
    "rich.*",
    "sentence_transformers.*",
    "tqdm.*",
    "qdrant_client.*",
    "mistralai.*",
    "google.*",
    "anthropic.*",
    "cohere.*",
    "streamlit.*",
    "uvicorn.*",
    "mcp.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests/", "build/", "dist/", ".venv/"]
skips = ["B101", "B601"]  # B101: assert_used (fine in tests), B601: paramiko (not used)
