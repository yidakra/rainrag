[tool.poetry]
name = "rainrag"
version = "0.1.0"
description = "Local-first RAG pipeline for VTT subtitle processing"
authors = ["RainRAG Team"]
readme = "README.md"
packages = [{include = "rainrag", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
torch = "^2.1.0"
transformers = "^4.35.0"
sentence-transformers = "^2.2.2"
qdrant-client = "^1.12.1"
pydantic = "^2.5.0"
loguru = "^0.7.2"
tqdm = "^4.66.0"
typer = {extras = ["all"], version = "^0.16.0"}
pyyaml = "^6.0.1"
numpy = "^1.24.0"
# Mistral API client
mistralai = "^1.0.0"
# Web frontend dependencies
streamlit = "^1.31.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.31.1"}
httpx = "^0.27.0"
python-dotenv = "^1.2.1"
openai = "^2.8.1"
anthropic = "^0.39.0"
google-generativeai = "^0.8.0"
cohere = "^5.20.0"
# MCP server
mcp = {extras = ["cli"], version = "^1.22.0"}
# BM25 for hybrid search
rank-bm25 = "^0.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
black = "^23.11.0"
ruff = "^0.5.3"
mypy = "^1.7.0"
types-pyyaml = "^6.0.12"
pre-commit = "^4.4.0"
bandit = "^1.9.1"

[tool.poetry.scripts]
rainrag = "rainrag.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

# Enable specific rule sets
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
]

# Ignore specific rules
lint.ignore = [
    "E402",   # Module level import not at top of file (common in tests)
    "E501",   # Line too long (handled by formatter)
    "PTH123", # open() should be replaced by Path.open() (not always better)
    "PTH103", # os.makedirs() should be replaced by Path.mkdir()
    "SIM117", # Nested with statements (more readable in tests)
    "B017",   # pytest.raises(Exception) is fine for testing
    "B904",   # Exception chaining not always necessary
]

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
    ".ruff_cache",
]

# Allow autofix for all enabled rules
lint.fixable = ["ALL"]
lint.unfixable = []

# Configure isort
lint.isort.known-first-party = ["rainrag"]
lint.isort.force-single-line = false
lint.isort.lines-after-imports = 2

# Format configuration
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = false
show_error_codes = true
pretty = true
color_output = true

# Allow untyped calls for libraries without stubs
disallow_untyped_calls = false

# Incremental improvement - start lenient, tighten over time
no_implicit_optional = true

# Exclude test files
exclude = [
    "tests/",
    "build/",
    "dist/",
]

# Per-module options for third-party libraries
[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "tqdm.*",
    "qdrant_client.*",
    "mistralai.*",
    "google.generativeai.*",
    "anthropic.*",
    "cohere.*",
    "streamlit.*",
    "uvicorn.*",
    "mcp.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests/", "build/", "dist/", ".venv/"]
skips = ["B101", "B601"]  # B101: assert_used (fine in tests), B601: paramiko (not used)
