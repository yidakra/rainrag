# One path for one caller over Tailscale: the danbi try page's Telegram fetch.
#
# The danbi demo box needs POST /telegram/download (rainrag PR #102) so that
# Telegram videos come through rainrag's MTProto session, which must never be
# copied to a second machine (Telegram revokes a login used from two places at
# once). The demo box cannot reach the LAN origin on 8080, and 8080 must stay
# gateway-only because it serves the login form over plain HTTP. So this is a
# separate listener, as narrow as it can be:
#
# - bound to this server's Tailscale address only, never the LAN or 0.0.0.0;
# - only the demo box's Tailscale address may connect;
# - exactly one path; everything else is 404;
# - the API token is still required by the endpoint itself.
#
# Install:
#   sudo cp deploy/nginx/rag-tailnet-telegram.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/rag-tailnet-telegram.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 100.67.119.66:8090;          # ams-ai-rainrag-web on the tailnet

    allow 100.92.175.73;                # ams-ai-rainrag-gpu-for-project, the danbi demo box
    deny all;

    location = /telegram/download {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8001/telegram/download;
        # The API's TrustedHostMiddleware knows localhost, not the tailnet
        # address; the request does come from this machine's nginx.
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-For $remote_addr;
        # A long Telegram download streams for minutes; keep the connection.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
        client_max_body_size 16k;
    }

    location / {
        return 404;
    }
}
