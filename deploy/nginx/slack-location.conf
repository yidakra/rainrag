# Slack connector webhooks (Events API, slash commands, interactivity).
#
# This is a LOCATION SNIPPET, not a full server config, on purpose: the live
# nginx config on the box (cert paths, the internal-IP vhost on :7861, route
# set) is the source of truth, and shipping a complete server block in the
# repo invites someone to copy it over production and silently drop routes.
# Add this block inside the existing `server { listen 443 ... }` for
# rag.tvrain.tv instead.
#
# Requests are authenticated by the connector itself via Slack's request
# signature, so no auth is enforced at the proxy layer.
location /slack/ {
    proxy_pass http://127.0.0.1:8002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
}
