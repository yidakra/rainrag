# Plain-HTTP origin for an external TLS gateway (Alexander Efimov's https шлюз).
#
# The gateway terminates TLS and needs ONE upstream that serves every path the
# browser asks for: the Streamlit UI on / and the media the player fetches from
# the same origin (/video/, /vtt/, /hls/) plus /api/. Pointing a gateway at
# Streamlit alone renders the page and breaks playback.
#
# No TLS here on purpose: the gateway does it. No server_name, so any Host the
# gateway forwards is accepted (rag.tvrain.io as well as rag.tvrain.tv).
# X-Forwarded-Proto is pinned to https so the app builds https URLs even though
# this hop is plain HTTP.
#
# Install:
#   sudo cp deploy/nginx/rag-gateway-origin.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/rag-gateway-origin.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Reachable at http://172.16.52.220:8080 once the firewall allows the gateway.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    # Plain HTTP on the LAN, login form included, so only the TLS gateway may
    # use it. Done here rather than in a host firewall on purpose: ufw is
    # installed but inactive and the INPUT policy is ACCEPT, so enabling it
    # would default-deny SSH, 443 and Qdrant. This rule lives with the config
    # it protects and survives a reboot.
    allow 172.16.52.75;   # nginx.tvrain.io, Efimov's HTTPS gateway
    allow 127.0.0.1;      # local health checks
    allow ::1;
    deny all;

    client_max_body_size 512m;

    location / {
        proxy_pass http://localhost:7861;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://localhost:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /video/ {
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        # /hls/ segments on demand with ffmpeg, allowed up to 300s by
        # HLS_FFMPEG_TIMEOUT_SECONDS; nginx's 60s default would 504 the first
        # playback of a cold video (Tenki on #88). /slack/ gets the same so a
        # slow answer cannot break a webhook.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /vtt/ {
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        # /hls/ segments on demand with ffmpeg, allowed up to 300s by
        # HLS_FFMPEG_TIMEOUT_SECONDS; nginx's 60s default would 504 the first
        # playback of a cold video (Tenki on #88). /slack/ gets the same so a
        # slow answer cannot break a webhook.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /hls/ {
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        # /hls/ segments on demand with ffmpeg, allowed up to 300s by
        # HLS_FFMPEG_TIMEOUT_SECONDS; nginx's 60s default would 504 the first
        # playback of a cold video (Tenki on #88). /slack/ gets the same so a
        # slow answer cannot break a webhook.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Slack connector webhooks (Events API, slash commands, interactivity).
    # Moved here on 2026-09-16: they were registered against rag.tvrain.tv,
    # whose public path returns 522 (Cloudflare cannot reach this box, which
    # has no public address and no tunnel), so the bot had been receiving
    # nothing. Authenticated by the connector itself with Slack's request
    # signature, and this port is already restricted to the gateway.
    location /slack/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        # /hls/ segments on demand with ffmpeg, allowed up to 300s by
        # HLS_FFMPEG_TIMEOUT_SECONDS; nginx's 60s default would 504 the first
        # playback of a cold video (Tenki on #88). /slack/ gets the same so a
        # slow answer cannot break a webhook.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# ---------------------------------------------------------------------------
# Same origin over mutual TLS, for the gateway to move onto.
#
# Port 8080 above is plain HTTP: it carries the login form in cleartext across
# the office LAN, and its only control is the source address, which a host on
# that segment can spoof (CWE-319, review on PR #88). Here the gateway must
# present a certificate signed by the RainRAG origin CA, so the hop is both
# encrypted and authenticated.
#
# Set up with: sudo bash deploy/nginx/origin-mtls-setup.sh init
# The gateway owner sends a CSR; sign it with the same script and return only
# the certificate. Private keys do not travel.
#
# Both listeners run side by side on purpose. 8080 goes away in its own change
# once the gateway is verified on 8443, so the switch can be rolled back
# without needing the other side.
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;

    ssl_certificate     /etc/ssl/rainrag-origin/origin.crt;
    ssl_certificate_key /etc/ssl/rainrag-origin/private/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The actual control: no client certificate from our CA, no service.
    ssl_client_certificate /etc/ssl/rainrag-origin/ca.crt;
    ssl_verify_client on;

    # Plain HTTP on the LAN, login form included, so only the TLS gateway may
    # use it. Done here rather than in a host firewall on purpose: ufw is
    # installed but inactive and the INPUT policy is ACCEPT, so enabling it
    # would default-deny SSH, 443 and Qdrant. This rule lives with the config
    # it protects and survives a reboot.

    client_max_body_size 512m;

    location / {
        proxy_pass http://localhost:7861;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/ {
