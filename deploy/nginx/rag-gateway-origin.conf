        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /video/ {
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        # /hls/ segments on demand with ffmpeg, allowed up to 300s by
        # HLS_FFMPEG_TIMEOUT_SECONDS; nginx's 60s default would 504 the first
        # playback of a cold video (Tenki on #88). /slack/ gets the same so a
        # slow answer cannot break a webhook.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /vtt/ {
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        # /hls/ segments on demand with ffmpeg, allowed up to 300s by
        # HLS_FFMPEG_TIMEOUT_SECONDS; nginx's 60s default would 504 the first
