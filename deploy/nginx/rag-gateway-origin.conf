        # slow answer cannot break a webhook.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Slack connector webhooks (Events API, slash commands, interactivity).
    # Moved here on 2026-09-16: they were registered against rag.tvrain.tv,
    # whose public path returns 522 (Cloudflare cannot reach this box, which
    # has no public address and no tunnel), so the bot had been receiving
    # nothing. Authenticated by the connector itself with Slack's request
    # signature, and this port is already restricted to the gateway.
    location /slack/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        # /hls/ segments on demand with ffmpeg, allowed up to 300s by
