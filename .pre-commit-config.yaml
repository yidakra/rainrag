# Pre-commit hooks for RainRAG
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.15
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter
      - id: ruff-format

  # Mypy - Type checking (optional - disabled by default, slow and needs all deps)
  # Uncomment to enable type checking in pre-commit
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.7.1
  #   hooks:
  #     - id: mypy
  #       args: [--no-error-summary, --config-file=pyproject.toml]
  #       additional_dependencies:
  #         - types-PyYAML
  #       files: ^src/
  #       exclude: ^tests/

  # Built-in hooks for basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom YAML tags
        exclude: ^helm/  # Exclude Helm templates (use Go templating)
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # Security checks (optional - can be run separately or in CI)
  # Uncomment to enable bandit security scanning in pre-commit
  # - repo: https://github.com/PyCQA/bandit
  #   rev: 1.7.5
  #   hooks:
  #     - id: bandit
  #       args: [-c, pyproject.toml, -r, src/]
  #       additional_dependencies: ["bandit[toml]"]

# Configuration
default_language_version:
  python: python3.11

# Skip certain hooks for certain files
exclude: |
  (?x)^(
      \.git/|
      \.venv/|
      __pycache__/|
      \.pytest_cache/|
      \.ruff_cache/|
      dist/|
      build/
  )
