# Default values for RainRAG Helm chart

# Qdrant vector database configuration
qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: v1.7.4
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 6333
    grpcPort: 6334

  persistence:
    enabled: true
    storageClass: ""  # Use default storage class
    accessMode: ReadWriteOnce
    size: 10Gi
    # For local development with Minikube, you can use hostPath
    # hostPath: /data/qdrant

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

# RainRAG ingestion job configuration
ingestion:
  enabled: true
  image:
    repository: rainrag
    tag: latest
    pullPolicy: IfNotPresent

  # Job configuration
  job:
    # Set to true to run as a CronJob instead of a one-time Job
    cron: false
    # Cron schedule (only used if cron is true)
    schedule: "0 2 * * *"  # Run daily at 2 AM
    # Number of successful jobs to keep
    successfulJobsHistoryLimit: 3
    # Number of failed jobs to keep
    failedJobsHistoryLimit: 1
    # Restart policy
    restartPolicy: OnFailure
    # Backoff limit for failed jobs
    backoffLimit: 3

  # Pipeline steps to run
  pipeline:
    # Set to true to run full pipeline (ingest -> embed -> index)
    runFullPipeline: true
    # Individual step flags (only used if runFullPipeline is false)
    runIngest: true
    runEmbed: true
    runIndex: true
    # Recreate Qdrant collection
    recreateIndex: false

  # Volume mounts for data
  volumes:
    # Archive directory containing .vtt files
    archive:
      # Use hostPath for local development
      hostPath: /data/archive
      # Or use PVC
      # persistentVolumeClaim: archive-pvc
      mountPath: /data/archive

    # Data directory for outputs
    data:
      hostPath: /data/rainrag
      # Or use PVC
      # persistentVolumeClaim: rainrag-data-pvc
      mountPath: /data/rainrag

    # Embeddings cache directory
    embeddings:
      hostPath: /data/embeddings
      # Or use PVC
      # persistentVolumeClaim: embeddings-pvc
      mountPath: /data/embeddings

  # RainRAG configuration (maps to config.yaml)
  config:
    paths:
      archive_root: "/data/archive"
      docs_output: "/data/rainrag/docs.jsonl"
      embeddings_cache: "/data/embeddings"

    embedding:
      model_name: "intfloat/multilingual-e5-large"
      batch_size: 32
      max_seq_length: 512
      device: "cpu"  # Use "cuda" if GPU is available
      normalize_embeddings: true

    qdrant:
      host: "rainrag-qdrant"
      port: 6333
      collection_name: "broadcast_transcripts"
      vector_size: 1024
      distance: "Cosine"
      recreate_collection: false

    mistral:
      api_key: ""  # Set via environment variable MISTRAL_API_KEY
      model_name: "mistral-small-latest"
      max_tokens: 512
      temperature: 0.3
      top_k: 5

    processing:
      num_workers: 4
      max_file_size: 10485760
      min_text_length: 50

    logging:
      level: "INFO"
      format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
      log_file: "/data/rainrag/logs/rainrag.log"

  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "8Gi"
      cpu: "4000m"

# FastAPI backend configuration
api:
  enabled: true
  image:
    repository: rainrag
    tag: latest
    pullPolicy: IfNotPresent

  # Number of replicas
  replicas: 1

  service:
    type: ClusterIP
    port: 8001

  # Optional authentication token
  authToken: ""  # Set to enable token-based authentication

  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

# Streamlit frontend configuration
streamlit:
  enabled: true
  image:
    repository: rainrag
    tag: latest
    pullPolicy: IfNotPresent

  # Number of replicas
  replicas: 1

  service:
    type: NodePort  # Use NodePort for LAN access, or LoadBalancer for cloud
    port: 7860
    nodePort: 30786  # Fixed port for easy access (30000-32767 range)

  # Optional authentication token (should match api.authToken if used)
  authToken: ""  # Set to enable token-based authentication

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Global settings
nameOverride: ""
fullnameOverride: ""
