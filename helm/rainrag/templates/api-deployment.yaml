{{- if .Values.api.enabled }}
{{- if and .Values.ingestion.config.notify.enabled (gt (int .Values.api.replicas) 1) }}
{{- fail "notify.enabled needs api.replicas: 1. The notify queue is a file with an in-process lock, so two API replicas would overwrite each other's entries." }}
{{- end }}
{{- if and .Values.api.notifyToken (eq (include "rainrag.notifyTokenEnv" .) "RAINRAG_AUTH_TOKEN") }}
{{- fail "ingestion.config.notify.token_env must not be RAINRAG_AUTH_TOKEN: the webhook token would replace the API token and open every route." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rainrag.fullname" . }}-api
  labels:
    {{- include "rainrag.api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  {{- if .Values.ingestion.config.notify.enabled }}
  # The notify queue's lock is per process: a rolling update would run the old
  # and the new worker on one queue file at once.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "rainrag.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rainrag.api.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when a token or the config changes: env vars and the
        # mounted config are read at start.
        checksum/api-secret: {{ include (print $.Template.BasePath "/api-secret.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
      - name: api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        command:
          - python
          - -m
          - uvicorn
          - rainrag.api:app
          - --host
          - "0.0.0.0"
          - --port
          - "{{ .Values.api.service.port }}"
        ports:
        - name: http
          containerPort: {{ .Values.api.service.port }}
          protocol: TCP
        env:
        - name: RAINRAG_CONFIG
          value: "/config/config.yaml"
        {{- if .Values.api.authToken }}
        - name: RAINRAG_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "rainrag.fullname" . }}-api-secret
              key: auth-token
        {{- end }}
        {{- if .Values.api.notifyToken }}
        - name: {{ include "rainrag.notifyTokenEnv" . }}
          valueFrom:
            secretKeyRef:
              name: {{ include "rainrag.fullname" . }}-api-secret
              key: notify-token
        {{- end }}
        {{- with .Values.providerSecret }}
        envFrom:
        - secretRef:
            name: {{ . }}
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data/rainrag
        - name: embeddings
          mountPath: /data/embeddings
        {{- if .Values.ingestion.config.notify.enabled }}
        - name: archive
          mountPath: {{ .Values.ingestion.volumes.archive.mountPath }}
          readOnly: true
        {{- end }}
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
            # TrustedHostMiddleware rejects the pod IP the kubelet would send.
            httpHeaders:
            - name: Host
              value: localhost
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
            # TrustedHostMiddleware rejects the pod IP the kubelet would send.
            httpHeaders:
            - name: Host
              value: localhost
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: config
        configMap:
          name: {{ include "rainrag.fullname" . }}-config
      - name: data
        {{- if .Values.ingestion.volumes.data.persistentVolumeClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.ingestion.volumes.data.persistentVolumeClaim }}
        {{- else }}
        hostPath:
          path: {{ .Values.ingestion.volumes.data.hostPath }}
          type: DirectoryOrCreate
        {{- end }}
      - name: embeddings
        {{- if .Values.ingestion.volumes.embeddings.persistentVolumeClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.ingestion.volumes.embeddings.persistentVolumeClaim }}
        {{- else }}
        hostPath:
          path: {{ .Values.ingestion.volumes.embeddings.hostPath }}
          type: DirectoryOrCreate
        {{- end }}
      {{- if .Values.ingestion.config.notify.enabled }}
      - name: archive
        {{- if .Values.ingestion.volumes.archive.persistentVolumeClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.ingestion.volumes.archive.persistentVolumeClaim }}
        {{- else }}
        hostPath:
          path: {{ .Values.ingestion.volumes.archive.hostPath }}
          type: Directory
        {{- end }}
      {{- end }}
{{- end }}
