{{- if .Values.qdrant.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rainrag.fullname" . }}-qdrant
  labels:
    {{- include "rainrag.qdrant.labels" . | nindent 4 }}
spec:
  type: {{ .Values.qdrant.service.type }}
  ports:
  - port: {{ .Values.qdrant.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  - port: {{ .Values.qdrant.service.grpcPort }}
    targetPort: grpc
    protocol: TCP
    name: grpc
  selector:
    {{- include "rainrag.qdrant.selectorLabels" . | nindent 4 }}
{{- end }}
