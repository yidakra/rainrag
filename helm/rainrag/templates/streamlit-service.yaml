{{- if .Values.streamlit.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rainrag.fullname" . }}-streamlit
  labels:
    {{- include "rainrag.streamlit.labels" . | nindent 4 }}
spec:
  type: {{ .Values.streamlit.service.type }}
  ports:
    - port: {{ .Values.streamlit.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.streamlit.service.type "NodePort") .Values.streamlit.service.nodePort }}
      nodePort: {{ .Values.streamlit.service.nodePort }}
      {{- end }}
  selector:
    {{- include "rainrag.streamlit.selectorLabels" . | nindent 4 }}
{{- end }}
