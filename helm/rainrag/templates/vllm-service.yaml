{{- if .Values.vllm.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rainrag.fullname" . }}-vllm
  labels:
    {{- include "rainrag.vllm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.vllm.service.type }}
  ports:
  - port: {{ .Values.vllm.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "rainrag.vllm.selectorLabels" . | nindent 4 }}
{{- end }}
