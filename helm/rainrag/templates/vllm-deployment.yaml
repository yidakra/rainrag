{{- if .Values.vllm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rainrag.fullname" . }}-vllm
  labels:
    {{- include "rainrag.vllm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.vllm.replicas }}
  selector:
    matchLabels:
      {{- include "rainrag.vllm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rainrag.vllm.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: vllm
        image: "{{ .Values.vllm.image.repository }}:{{ .Values.vllm.image.tag }}"
        imagePullPolicy: {{ .Values.vllm.image.pullPolicy }}
        args:
          - --model
          - {{ .Values.vllm.modelName | quote }}
          - --host
          - "0.0.0.0"
          - --port
          - "{{ .Values.vllm.service.port }}"
          {{- if .Values.vllm.gpuMemoryUtilization }}
          - --gpu-memory-utilization
          - "{{ .Values.vllm.gpuMemoryUtilization }}"
          {{- end }}
          {{- if .Values.vllm.maxModelLen }}
          - --max-model-len
          - "{{ .Values.vllm.maxModelLen }}"
          {{- end }}
          {{- if .Values.vllm.tensorParallelSize }}
          - --tensor-parallel-size
          - "{{ .Values.vllm.tensorParallelSize }}"
          {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.vllm.service.port }}
          protocol: TCP
        resources:
          {{- toYaml .Values.vllm.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        {{- if .Values.vllm.volumeMounts }}
        volumeMounts:
          {{- toYaml .Values.vllm.volumeMounts | nindent 10 }}
        {{- end }}
      {{- if .Values.vllm.volumes }}
      volumes:
        {{- toYaml .Values.vllm.volumes | nindent 8 }}
      {{- end }}
{{- end }}
