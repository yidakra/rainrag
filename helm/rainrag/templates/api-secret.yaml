{{- if and .Values.api.enabled (or .Values.api.authToken .Values.api.notifyToken) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rainrag.fullname" . }}-api-secret
  labels:
    {{- include "rainrag.api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.api.authToken }}
  auth-token: {{ .Values.api.authToken | quote }}
  {{- end }}
  {{- if .Values.api.notifyToken }}
  notify-token: {{ .Values.api.notifyToken | quote }}
  {{- end }}
{{- end }}
