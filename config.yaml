# RainRAG Configuration

# Data paths
paths:
  # Root directory containing .vtt files
  # IMPORTANT: Ensure this path is correct and accessible. The system will recursively search for .vtt files in this directory.
  archive_root: "/mnt/vod/srv/storage/transcoded"
  # Output directory for parsed documents
  docs_output: "./data/docs.jsonl"
  # Directory for cached embeddings
  embeddings_cache: "./embeddings"
  # Root directory containing video files (defaults to archive_root if not specified)
  video_root: "/mnt/vod/srv/storage/transcoded"

# Embedding model configuration
embedding:
  # Embedding provider: 'local' for local model, 'mistral' for Mistral API, 'openai' for OpenAI API, 'gemini' for Google Gemini API
  # IMPORTANT: Ensure vector_size in qdrant section matches the chosen embedding model's output dimension
  provider: "local"
  model_name: "intfloat/multilingual-e5-large"
  batch_size: 128   # VRAM guide: recommend >=12–16GB for embeddings at 128; 4–8GB GPUs may OOM—reduce to 32–64 for low-memory devices
  max_seq_length: 512
  device: "auto"  # Auto-selects cuda/mps/cpu at runtime based on availability
  normalize_embeddings: true

# Qdrant vector store configuration
qdrant:
  host: "localhost"
  port: 6333
  timeout: 180
  upsert_batch_size: 250
  scroll_batch_size: 500
  max_scroll_iterations: 5000
  max_scroll_duration: 3600
  collection_name: "broadcast_transcripts"
  vector_size: 1024  # Must match the embedding model's output dimension:
                     #   - intfloat/multilingual-e5-large: 1024
                     #   - text-embedding-3-small: 1536
                     #   - text-embedding-3-large: 3072
                     #   - mistral-embed: 1024
                     #   - models/text-embedding-004: 3072
  distance: "Cosine"
  # Set to true to recreate collection on indexing
  # WARNING: Setting recreate_collection: false preserves existing data but will cause failures
  # if collection parameters change. Users must manually drop/recreate the collection when changing
  # embedding model parameters such as vector_size or distance (or switching embedding models).
  # Reindex or recreate the collection to avoid schema/metric mismatches.
  recreate_collection: false

# LLM provider configuration
llm:
  # LLM provider: 'mistral' for Mistral API, 'openai' for OpenAI API, 'claude' for Anthropic Claude API, 'gemini' for Google Gemini API
  provider: "mistral"

# Mistral API configuration
mistral:
  api_key: ""  # Set your Mistral API key here or via MISTRAL_API_KEY environment variable
  model_name: "mistral-large-latest"  # Largest Mistral model for best quality
  max_tokens: 2048
  temperature: 0
  top_k: 5  # Number of documents to retrieve for context

# OpenAI API configuration
openai:
  api_key: ""  # Set your OpenAI API key here or via OPENAI_API_KEY environment variable
  model_name: "gpt-4o-mini"  # Options: gpt-4o, gpt-4o-mini, gpt-3.5-turbo, etc.
  embedding_model: "text-embedding-3-large"  # Options: text-embedding-3-small (1536-dim), text-embedding-3-large (3072-dim)
                                              # IMPORTANT: Update qdrant.vector_size to match the chosen model's dimension
  max_tokens: 2048
  temperature: 0
  top_k: 5  # Number of documents to retrieve for context

# Anthropic Claude API configuration
claude:
  api_key: ""  # Set your Anthropic API key here or via ANTHROPIC_API_KEY environment variable
  model_name: "claude-haiku-4-5-20251001"
  max_tokens: 2048
  temperature: 0
  top_k: 5  # Number of documents to retrieve for context

# Google Gemini API configuration
gemini:
  api_key: ""  # Set your Google API key here or via GOOGLE_API_KEY environment variable
  model_name: "gemini-2.5-flash"  # Options: gemini-2.5-flash, gemini-2.5-pro, gemini-2.5-flash-exp, etc.
  embedding_model: "models/text-embedding-004"  # Options: models/text-embedding-004, models/embedding-001, etc.
  max_tokens: 2048
  temperature: 0
  top_k: 5  # Number of documents to retrieve for context

# Cohere API configuration (for reranking)
cohere:
  api_key: ""  # Set your Cohere API key here or via COHERE_API_KEY environment variable
  model_name: "rerank-v3.5"  # Options: rerank-v3.5, rerank-english-v3.0, rerank-multilingual-v3.0

# Reranker configuration
reranker:
  enabled: true  # Set to true to enable reranking
  provider: "cohere"
  top_n: 5  # Number of documents to return after reranking
  initial_k: 20  # Number of candidates to retrieve before reranking
  min_retrieval_score: 0.0  # Minimum document score (0-1) to include in prompt (0 disables)

# Chunking configuration
chunking:
  enabled: true  # Enable chunking of VTT files by time
  chunk_duration_seconds: 300  # 5 minutes per chunk
  overlap_seconds: 30  # 30-second overlap between chunks to prevent information loss
  max_chunk_tokens: null  # Auto-detect based on embedding model (null = auto)
  min_chunk_tokens: 50  # Minimum tokens per chunk
  token_buffer: 50  # Buffer to account for special tokens

# Hybrid search configuration (Vector + BM25)
# Provides Stage 1 corpus smoothing (BM25 IDF ≈ Dirichlet prior) when enabled
hybrid_search:
  enabled: false  # Enable hybrid search combining vector similarity and BM25 keyword matching
  bm25_weight: 0.3  # Weight for BM25 scores (0.0-1.0, vector weight = 1 - bm25_weight)
  top_k_multiplier: 3  # Retrieve top_k * multiplier documents before reranking
  fusion_method: "rrf"  # Score fusion method: 'rrf' (Reciprocal Rank Fusion) or 'weighted'
  rrf_k: 60  # RRF constant (standard value from literature)

# Two-stage retrieval configuration (Zhai & Lafferty, SIGIR 2002)
# Stage 1 (corpus smoothing) is handled by hybrid_search.enabled above.
# Stage 2 (query-side smoothing) is configured here.
two_stage:
  enabled: false  # Master switch for Stage 2 query-side smoothing

  # Stage 2a: LLM query rewriting
  # Rewrites the user query into transcript-register variants before retrieval.
  # Addresses vocabulary mismatch between formal queries and spoken transcripts.
  query_rewrite_enabled: true
  query_rewrite_variants: 2  # Number of rewrites (original always included, so 3 total)
  # Higher temperature → more diverse paraphrases. Keep separate from answer temperature (0).
  query_rewrite_temperature: 0.7

  # Stage 2b: HyDE (Hypothetical Document Embedding)
  # Generates a hypothetical transcript passage and blends its embedding with the query.
  # More expensive (1 extra LLM call + 1 embed). Enable for highest recall.
  hyde_enabled: false
  hyde_alpha: 0.5      # Blend weight: 0.0 = raw query only, 1.0 = HyDE only
  # Higher temperature → more varied hypothetical passages, improving embedding coverage.
  # Keep separate from answer temperature (0) for deterministic journalist output.
  hyde_temperature: 0.7

  # Multi-variant merge strategy (applied when query_rewrite_enabled and >1 variant)
  merge_strategy: "coverage"  # coverage | diverse_rrf
  merge_rrf_k: 60  # RRF constant used by 'diverse_rrf' merge strategy

  # Prompt document ordering (Axis F)
  prompt_doc_order: "rank"  # rank | reversed | book_end

# Processing configuration
processing:
  # Number of worker threads for file processing
  num_workers: 4
  # Skip files larger than this (in bytes)
  max_file_size: 10485760  # 10 MB
  # Minimum text length to process (in characters)
  min_text_length: 50

# Logging configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
  log_file: "./logs/rainrag.log"

# Video file serving configuration
video:
  enabled: true
  extensions:
    - ".mp4"
    - ".mkv"
    - ".webm"
    - ".avi"
    - ".mov"
  vtt_extensions:
    - ".vtt"
    - ".en.vtt"
    - ".ru.vtt"

# Single-video upload mode: drag-drop a video -> transcribe -> scoped Q&A.
# Each upload gets its own ephemeral Qdrant collection so answers are isolated
# to that video. OpenAI handles transcription in this deployment; the local
# faster-whisper settings remain available as an explicit fallback.
video_upload:
  enabled: true
  provider: "openai"
  openai_model: "whisper-1"            # required for segment timestamps / VTT
  openai_api_key_env: "OPENAI_API_KEY"
  openai_workers: 2                     # at most two uploads transcribe concurrently
  openai_chunk_seconds: 1800            # 30-minute silence-aware chunks
  openai_silence_window_seconds: 30
  # Local fallback settings (used only when provider: "local").
  livevtt_python: "/home/ubuntu/livevtt/.venv/bin/python"  # interpreter with faster-whisper
  transcribe_script: "scripts/transcribe_one.py"           # single-file transcriber
  model: "large-v3-turbo"        # faster-whisper model (turbo ~halves latency vs large-v3)
  compute_type: "float32"   # avoids CUDA OOM on large models
  device: "cpu"
  # Leave device_indices empty to use every GPU the transcription environment
  # can see (one concurrent upload per GPU). Set an explicit list to pin
  # transcription to specific devices, e.g. [0] to leave GPU 1 for other work.
  device_indices: []
  device_index: 0                 # used only if GPU detection is unavailable
  # "auto" lets Whisper detect the language from the audio, so a journalist does
  # not have to know it in advance. Set an explicit code (e.g. "ru") to force one.
  language: "auto"
  language_detection_segments: 4  # sample several windows, not just the intro
  multilingual: true              # re-detect per window so mixed-language video works
  beam_size: 5
  tmp_root: "./data/video_sessions"   # per-session working files
  collection_prefix: "session_"       # ephemeral collection name prefix
  session_ttl_seconds: 21600          # auto-cleanup after 6h (a working session)
  # The Streamlit client buffers the whole file in memory before sending, so this
  # cap also bounds UI memory per concurrent upload. Raise with that in mind.
  max_upload_mb: 512                  # reject uploads larger than this
  # --- Telegram (MTProto) video import ---
  # yt-dlp reaches Telegram by scraping the t.me embed page, which omits the
  # video element for most posts (~1 in 3 worked in testing). MTProto asks
  # Telegram directly and is not subject to that.
  # Setup: get api_id/api_hash from https://my.telegram.org, put
  # TELEGRAM_API_ID / TELEGRAM_API_HASH in .env (systemd hands that file to the
  # API service, so shell exports would not reach it), run
  # scripts/telegram_login.py once, then set this to true. The session file is a
  # credential granting full access to that account -- prefer a dedicated
  # number over a personal one.
  telegram_enabled: false
  telegram_session_path: "./data/telegram.session"
  telegram_flood_sleep_threshold: 60  # absorb FloodWait pauses up to this many seconds
  # Drop leftover session collections/dirs from previous runs at startup. Session
  # state is in-process, so without this a restart leaks them permanently.
  # Disable only if several API workers share one Qdrant instance.
  sweep_orphans_on_start: true

# MCP server configuration
mcp:
  # Transport protocol: "stdio" for local CLI tools (Claude Desktop, Cursor),
  # "streamable-http" for HTTP-based connections, "sse" for Server-Sent Events
  transport: "stdio"
  # Host for HTTP-based transports (ignored for stdio)
  host: "localhost"
  # Port for HTTP-based transports (ignored for stdio)
  port: 8000

# Incremental re-indexing configuration
incremental:
  enabled: true  # Enable incremental processing (only re-process changed documents)
  manifest_path: "./data/manifest.json"  # File tracking source VTT file state for change detection
  alias_swap: false  # Use two-phase indexing with collection alias swap for zero-downtime updates

# Web metadata integration
web_metadata:
  enabled: true
  source: "hybrid"  # "local" = disk only, "api" = API with local cache, "hybrid" = disk first then API fallback
  path: "./web_metadata"
  api_url: "https://library.tvrain.tv"
  api_token_env: "LIBRARY_API_TOKEN"  # env var holding the Bearer token
  api_batch_days: 180  # days to look back in batch export (max 180)
  min_content_length: 10  # Intentionally permissive threshold to prevent near-empty content ingestion
  include_in_text: true
  append_label: "[Web]"
  append_to_each_chunk: true
  fields: ["title", "date", "description"]
  require_web_metadata: false  # Mode 2: Only ingest videos with web metadata; Mode 1 (false): Ingest all videos with null web fields when metadata missing
