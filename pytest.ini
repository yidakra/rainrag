[pytest]
testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --ignore=tests/unit/test_embed.py
    --ignore=tests/unit/test_embed_providers.py
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
