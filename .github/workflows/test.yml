name: Tests

on:
  push:
    branches: [main, develop, claude/**]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the others. Without this a single
      # flaky job takes the whole matrix with it and the surviving versions
      # report CANCELLED, which reads as "everything is broken".
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v --tb=short --cov=src/rainrag --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        # `fail_ci_if_error` is not enough: the action can die in its own
        # process before that flag is read, which is what an SSL handshake
        # failure against Codecov does. eval-tests.yml already guards this
        # way; this workflow never caught up.
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
