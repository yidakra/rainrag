name: Eval Suite Tests

'on':
  push:
    branches: [main, develop]
    paths:
      - "eval/**"
      - "src/rainrag_eval/**"
      - "tests/unit/test_eval_*.py"
      - "tests/unit/test_query_two_stage.py"
      - "tests/unit/test_run_eval_two_stage.py"
      - "tests/unit/test_two_stage_sweep.py"
      - "tests/unit/test_mlflow_tracking.py"
      - "pyproject.toml"
      - ".github/workflows/eval-tests.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "eval/**"
      - "src/rainrag_eval/**"
      - "tests/unit/test_eval_*.py"
      - "tests/unit/test_query_two_stage.py"
      - "tests/unit/test_run_eval_two_stage.py"
      - "tests/unit/test_two_stage_sweep.py"
      - "tests/unit/test_mlflow_tracking.py"
      - "pyproject.toml"
      - ".github/workflows/eval-tests.yml"

jobs:
  eval-unit-tests:
    name: Eval unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (main + eval group)
        run: uv sync --frozen --extra eval

      - name: Smoke test
        run: |
          uv run pytest \
            tests/unit/test_eval_smoke.py

      - name: Run eval unit tests
        run: |
          uv run pytest -v --tb=short \
            tests/unit/test_eval_*.py \
            tests/unit/test_query_two_stage.py \
            tests/unit/test_run_eval_two_stage.py \
            tests/unit/test_two_stage_sweep.py \
            tests/unit/test_mlflow_tracking.py \
            --cov=src/eval \
            --cov-report=xml:coverage-eval.xml \
            --cov-report=term-missing

      - name: Upload eval coverage
        uses: codecov/codecov-action@v4
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11'
        continue-on-error: true
        with:
          use_oidc: true
          files: ./coverage-eval.xml
          flags: eval
          fail_ci_if_error: false
