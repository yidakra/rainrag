name: Eval Suite Tests

on:
  push:
    branches: [main, develop, claude/**]
    paths:
      - "eval/**"
      - "tests/unit/test_eval_*.py"
      - ".github/workflows/eval-tests.yml"
      - "pyproject.toml"
  pull_request:
    branches: [main, develop]
    paths:
      - "eval/**"
      - "tests/unit/test_eval_*.py"
      - "pyproject.toml"

jobs:
  eval-unit-tests:
    name: Eval unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-eval-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-eval-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies (main + eval group)
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: |
          poetry install --no-interaction --no-root --with eval
          poetry cache clear pypi --all

      - name: Install project
        run: poetry install --no-interaction --with eval

      - name: Smoke test (import check)
        run: |
          poetry run pytest \
            tests/unit/test_eval_smoke.py \
            --collect-only -q

      - name: Run eval unit tests
        run: |
          poetry run pytest \
            tests/unit/test_eval_metrics.py \
            tests/unit/test_eval_helpers.py \
            tests/unit/test_eval_smoke.py \
            -v --tb=short \
            --cov=eval \
            --cov-report=xml:coverage-eval.xml \
            --cov-report=term-missing

      - name: Upload eval coverage
        uses: codecov/codecov-action@v3
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage-eval.xml
          flags: eval
          fail_ci_if_error: false
